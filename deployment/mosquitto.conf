# Local Mosquitto broker for LogiBridge development.
#   1883  TCP         — Python services (simulator, preprocessing, inference, ...)
#   9001  WebSockets  — dashboard/logiedge_dashboard.html in the browser
#
# Run from the repository root:
#   "C:\Program Files\mosquitto\mosquitto.exe" -c deployment/mosquitto.conf -v

listener 1883
listener 9001
protocol websockets

# Local development only: no authentication.
allow_anonymous true
